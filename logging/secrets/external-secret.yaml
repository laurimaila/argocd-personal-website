apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: logging-secrets
  namespace: logging
spec:
  refreshInterval: "3h"
  secretStoreRef:
    name: oci-vault-store
    kind: ClusterSecretStore
  target:
    name: logging-secrets
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: logging-secrets
