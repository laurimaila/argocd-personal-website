apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: personal-website-image-updater
  namespace: argocd
spec:
  writeBackConfig:
    method: git
    gitConfig:
      writeBackTarget: "helmvalues:values.yaml"
  applicationRefs:
    - namePattern: "personal-website-*"
      useAnnotations: true
