apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: personal-website-dev-secrets
  namespace: personal-website-dev
spec:
  refreshInterval: "3h"
  secretStoreRef:
    name: oci-vault-store
    kind: ClusterSecretStore
  target:
    name: personal-website-dev-secrets
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: personal-website-dev-secrets
