apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Chart.Name }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Chart.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: personal-website-backend
      ports:
        - port: 50051
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
